/* Reference-sheet layout (not part of the screen) */

* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-subtle); color: var(--text); font-family: var(--font-sans); }
.doc { padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 40px; }
.doc > header { max-width: 760px; display: flex; flex-direction: column; gap: 8px; }
.doc h1 { margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.015em; }
.doc .lede { margin: 0; font-size: 16px; line-height: 24px; color: var(--text-secondary); }
.doc .meta { margin: 0; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
.doc code { font-size: 13px; padding: 1px 6px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); }
.group { display: flex; flex-direction: column; gap: 16px; }
.group > h2 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
.group > p { margin: 0; max-width: 760px; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
.row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: 32px; overflow-x: auto; }
.frame { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.frame figcaption { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
.device { position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans);
  border: 1px solid var(--border-control); }
.device--mobile { width: 360px; height: 800px; border-radius: 24px; }
.device--desktop { width: 1440px; min-height: 900px; border-radius: 14px; }
.device a { color: var(--brand); }
.device a:hover { color: var(--brand-hover); }
.device :focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .device * { animation: none !important; transition: none !important; } }

</style>

<div class="doc">
<header>
<h1>Launch screen</h1>
<p class="lede">Shown while the session is checked (FR-NAV-004). The same centred layout is used at every width.</p>
<p class="meta">Spec: <code>splash.md</code> · Tokens: <code>docs/design-system/tokens.json</code> · Each frame shows the light and dark theme with the same markup; only <code>data-theme</code> changes.</p>
</header>
<section class="group" data-group="0">
<h2>Default</h2>

<div class="row">
<figure class="frame">
<figcaption>Mobile · 360 × 800 · Light</figcaption>
<div class="device device--mobile" data-theme="light">
<main aria-busy="true" style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-6); background: var(--brand); color: var(--on-brand); font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div role="img" aria-label="HØEM" style="font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: 2px">H<span style="color: var(--brand-tint)">Ø</span>EM</div>
  <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: var(--space-3)">
    <div aria-hidden="true" style="width: 120px; height: 4px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--on-brand) 25%, transparent); overflow: hidden"><div style="width: 45%; height: 100%; border-radius: var(--radius-full); background: var(--surface)"></div></div>
    <span style="font-size: 14px; line-height: 20px; color: var(--brand-tint)">Opening your home…</span>
  </div>
</main>
</div>
</figure>
