.frame figcaption { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
.device { position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans);

.device--mobile { width: 360px; height: 800px; border-radius: 24px; }
.device--desktop { width: 1440px; min-height: 900px; border-radius: 14px; }
.device a { color: var(--brand); }

.device :focus-visible { outline: var(--stroke-focus) solid var(--focus-ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .device * { animation: none !important; transition: none !important; } }
