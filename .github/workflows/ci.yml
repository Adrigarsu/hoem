name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # next.config.ts validates these, and typecheck and build both load it.
    # Local Supabase placeholders, not secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      RESEND_API_KEY: re_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version input: the action reads it from the packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests with coverage
        run: pnpm test:coverage

  # NFR-UX-001, NFR-A11Y-001: the production build in Chromium, Chrome and Safari (WebKit) at three
  # widths, with axe-core in both themes. Firefox and Edge are not wired up yet. A throw-away local
  # Supabase (database, Auth, REST and the Mailpit mail catcher) serves the auth stories.
  # Split in two runners: the whole suite took close to the time limit on one.
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The Supabase URL and key come from the local stack, set in a step below. Placeholder, not a
    # secret: nothing in the E2E tests sends real e-mail.
    env:
      RESEND_API_KEY: re_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Google Chrome is preinstalled on GitHub's Ubuntu runners; Chromium and WebKit come from
      # Playwright. Both the browsers and the ~70 apt packages they need (WebKit's GStreamer and
      # codecs among them) are cached: GitHub's Ubuntu mirror has stalled for more than 20 minutes
      # (#55). The image version is a runner variable, which the env context does not hold.
      - name: Read the Playwright and runner image versions
        id: versions
        run: |
          echo "playwright=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # apt keeps the .deb files it downloads in a folder the cache can save. apt still installs
      # them itself, running their post-install scripts (font cache, ldconfig), which actions that
      # restore unpacked files skip; and no third-party action is needed. The sandbox user is root
      # because apt's own download user cannot write to a folder in the runner's home.
      - name: Keep apt downloads in a cacheable folder
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf '%s\n' \
            "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'APT::Sandbox::User "root";' | sudo tee /etc/apt/apt.conf.d/99-hoem-ci

      # The image fixes the package versions and Playwright the package list. Both shards share the
      # key: when both miss, one saves and the other warns that the cache already exists.
      - name: Cache browser system libraries
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ steps.versions.outputs.image }}-playwright-${{ steps.versions.outputs.playwright }}

      # With every package cached only `apt-get update` reaches the mirror. Four minutes is about
      # twice a cold install (~110 MB); a stalled one is stopped and tried once more instead of
      # eating the job's 25 minutes. The packages it finished downloading stay for the retry.
      # sudo runs apt-get in its own session (use_pty), out of reach of timeout's signal, so it is
      # stopped by name; then dpkg finishes anything left half done. Bash runs with -e here: the
      # cleanup must not end the step before the retry.
      - name: Install browser system libraries
        timeout-minutes: 10
        run: |
          for attempt in 1 2; do
            timeout --kill-after=15s 4m pnpm exec playwright install-deps chromium webkit && exit 0
            echo "::warning::Installing the browser system libraries timed out or failed (attempt $attempt)"
            sudo pkill -x apt-get || true
            while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 1; done
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium webkit

      - name: Start a local Supabase
        run: pnpm exec supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # next build inlines NEXT_PUBLIC_* values, so they must be set before the build.
      - name: Point the app at the local Supabase
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Pull requests never touch a shared database: every migration runs from scratch on a
  # throw-away Postgres, and the database tests run against it (ADR-014).
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail if the Drizzle schema has changes without a migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::src/db/schema changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Start Postgres and apply every migration
        run: pnpm exec supabase db start

      - name: Run database tests
        run: pnpm db:test
