name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # next.config.ts validates these, and typecheck and build both load it.
    # Local Supabase placeholders, not secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      RESEND_API_KEY: re_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version input: the action reads it from the packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests with coverage
        run: pnpm test:coverage

  # NFR-UX-001, NFR-A11Y-001: the production build in Chromium, Chrome and Safari (WebKit) at three
  # widths, with axe-core in both themes. Firefox and Edge are not wired up yet. A throw-away local
  # Supabase (database, Auth, REST and the Mailpit mail catcher) serves the auth stories.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The Supabase URL and key come from the local stack, set in a step below. Placeholder, not a
    # secret: nothing in the E2E tests sends real e-mail.
    env:
      RESEND_API_KEY: re_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Google Chrome is preinstalled on GitHub's Ubuntu runners; Chromium and WebKit come from
      # Playwright. The browsers are cached per Playwright version; their system libraries are not
      # cacheable, so they are installed on every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install browser system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Start a local Supabase
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # next build inlines NEXT_PUBLIC_* values, so they must be set before the build.
      - name: Point the app at the local Supabase
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Pull requests never touch a shared database: every migration runs from scratch on a
  # throw-away Postgres, and the database tests run against it (ADR-014).
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail if the Drizzle schema has changes without a migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::src/db/schema changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Start Postgres and apply every migration
        run: pnpm exec supabase db start

      - name: Run database tests
        run: pnpm db:test
