name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # next.config.ts validates these, and typecheck and build both load it.
    # Local Supabase placeholders, not secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      RESEND_API_KEY: re_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version input: the action reads it from the packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Pull requests never touch a shared database: every migration runs from scratch on a
  # throw-away Postgres, and the database tests run against it (ADR-014).
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail if the Drizzle schema has changes without a migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::src/db/schema changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Start Postgres and apply every migration
        run: pnpm exec supabase db start

      - name: Run database tests
        run: pnpm db:test
