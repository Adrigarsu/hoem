name: Bug report
description: Something does not work as expected.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      description: IDs from docs/srs.md, if you know them.
      placeholder: FR-SHOP-003

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Households
        - Dashboard
        - Meals
        - Shopping
        - Expenses
        - Planner
        - Integrations
        - Demo
        - Onboarding
        - Platform
        - Design system

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Select …
        3. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, device, theme, household type and role.
      placeholder: Firefox 140 on Android 15, dark theme, shared flat, member
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Hide personal data first.
